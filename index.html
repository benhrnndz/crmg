<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship Search</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #C8102E;
      --red-deep: #9E0B23;
      --red-soft: #FDF1F4;
      --ink: #1f2430;
      --ink-soft: #5e6472;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-strong: #ffffff;
      --line: #e9edf2;
      --success: #177a4d;
      --success-bg: #eaf8f0;
      --shadow: 0 18px 45px rgba(34, 21, 25, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(200, 16, 46, 0.12), transparent 35%),
        linear-gradient(180deg, #fff8f9 0%, #fff 32%, #fff 100%);
      position: relative;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 72px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
      position: relative;
      box-shadow: 0 10px 20px rgba(200, 16, 46, 0.25);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
    }

    .brand-mark::after {
      inset: 18px 12px 12px 18px;
      border-width: 1.5px;
      border-top-color: rgba(255,255,255,0.8);
      border-left-color: rgba(255,255,255,0.8);
      transform: rotate(16deg);
    }

    .hero {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
      border-radius: 28px;
      padding: clamp(28px, 4vw, 52px);
      color: #fff;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 24px;
      align-items: end;
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto -70px -90px auto;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .hero-copy,
    .hero-panel {
      position: relative;
      z-index: 1;
    }

    .office-line {
      display: inline-block;
      margin: 0 0 18px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-family: 'Barlow Condensed', 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      line-height: 0.96;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .tagline {
      margin: 16px 0 0;
      font-size: 1rem;
      opacity: 0.96;
      font-style: italic;
    }

    .hero-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.13);
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 0.82rem;
      font-weight: 600;
      backdrop-filter: blur(6px);
    }

    .dot-mini {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.12);
    }

    .hero-card {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(8px);
    }

    .hero-card-title {
      margin: 0 0 8px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .hero-card-value {
      margin: 0;
      font-weight: 700;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      line-height: 1;
    }

    .content {
      max-width: 700px;
      margin: 28px auto 0;
    }

    .search-panel {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px 18px 14px;
      backdrop-filter: blur(10px);
    }

    .search-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .subtitle {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.96rem;
      font-weight: 600;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 6px 10px 6px 14px;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.02);
    }

    .search-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--ink-soft);
      position: relative;
      opacity: 0.8;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 2px;
      background: var(--ink-soft);
      border-radius: 2px;
      right: -5px;
      bottom: -1px;
      transform: rotate(45deg);
    }

    input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: clamp(1rem, 2vw, 1.1rem);
      padding: 12px 0;
      outline: none;
    }

    input::placeholder {
      color: #9aa3b2;
    }

    .clear-button {
      border: none;
      background: var(--red-soft);
      color: var(--red-deep);
      font: inherit;
      font-weight: 700;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .clear-button:hover,
    .clear-button:focus-visible {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .clear-button[hidden] {
      display: none;
    }

    .results-panel {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px 18px 20px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .results-label {
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .results-count {
      background: var(--red-soft);
      color: var(--red-deep);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .record-list {
      display: grid;
      gap: 12px;
    }

    .person-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(31, 36, 48, 0.04);
    }

    .person-name {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.3;
      font-weight: 700;
      color: var(--ink);
    }

    .person-meta {
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success);
      padding: 7px 10px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .empty-state,
    .no-results {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 18px;
      color: var(--ink-soft);
      font-weight: 500;
      text-align: center;
      line-height: 1.6;
    }

    .glow {
      position: fixed;
      inset: 8% auto auto 50%;
      transform: translateX(-50%);
      width: min(90vw, 980px);
      height: min(80vw, 980px);
      background: radial-gradient(circle, rgba(200, 16, 46, 0.18) 0%, rgba(200, 16, 46, 0.04) 25%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    .horizon {
      position: fixed;
      left: 50%;
      bottom: -260px;
      transform: translateX(-50%);
      width: min(140vw, 1600px);
      height: 420px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(200, 16, 46, 0.12), rgba(200, 16, 46, 0.02));
      pointer-events: none;
      z-index: 0;
    }

    .dot {
      position: fixed;
      display: block;
      border-radius: 50%;
      background: rgba(200, 16, 46, 0.7);
      pointer-events: none;
      z-index: 0;
      animation: twinkle 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.35); }
    }

    @media (max-width: 720px) {
      .topbar {
        justify-content: center;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-panel {
        width: 100%;
      }

      .search-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .person-card {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="horizon"></div>

  <span class="dot" style="width:6px; height:6px; top:12%; left:15%; animation-delay:0s;"></span>
  <span class="dot" style="width:4px; height:4px; top:22%; left:80%; animation-delay:0.6s;"></span>
  <span class="dot" style="width:8px; height:8px; top:68%; left:10%; animation-delay:1.2s;"></span>
  <span class="dot" style="width:5px; height:5px; top:75%; left:88%; animation-delay:1.8s;"></span>
  <span class="dot" style="width:3px; height:3px; top:40%; left:92%; animation-delay:2.4s;"></span>
  <span class="dot" style="width:5px; height:5px; top:85%; left:45%; animation-delay:0.3s;"></span>

  <div class="app-shell">
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>City of Santa Rosa</span>
      </div>
    </div>

    <header class="hero">
      <div class="hero-copy">
        <div class="office-line">Congressman Roy Gonzales</div>
        <h1 style="margin: 0; line-height: 1;">
          <span style="display: block; font-size: 0.5em; line-height: 1; margin-bottom: 0.15em;">CHED TDP</span>
          <span style="display: block;">Scholarship Program '26-'27</span>
        </h1>
        <p class="tagline">"Sa Bagong Kongreso, Ramdam ang Serbisyo"</p>
      </div>

      <div class="hero-panel">
        <div class="stat-badge"><span class="dot-mini"></span> CHED TDP Applicants</div>
        <div class="hero-card">
          <p class="hero-card-title">Application Records</p>
          <p class="hero-card-value" id="totalCount">0</p>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="search-panel" aria-label="Applicant search panel">
        <div class="search-header">
          <p class="subtitle">Only qualified applicants will appear in this website.</p>
        </div>

        <div class="search-row">
          <div class="search-icon" aria-hidden="true"></div>
          <input type="text" id="searchInput" placeholder="Enter your Registered Name or Exact Student Number..." aria-label="Search applicants" />
          <button type="button" id="clearButton" class="clear-button" hidden aria-label="Clear search">Clear</button>
        </div>
      </section>

      <section class="results-panel" aria-live="polite">
        <div class="results-header">
          <p class="results-label">Results</p>
          <span class="results-count" id="resultsCount">0 matches</span>
        </div>
        <div id="results" class="record-list"></div>
      </section>
    </main>
  </div>

  <script>
    let applicants = [];
    const resultsEl = document.getElementById('results');
    const inputEl = document.getElementById('searchInput');
    const clearButton = document.getElementById('clearButton');
    const resultsCountEl = document.getElementById('resultsCount');

    fetch('applicants.json')
      .then(function (response) {
        if (!response.ok) {
          throw new Error('Unable to load applicants data.');
        }
        return response.json();
      })
      .then(function (data) {
        applicants = Array.isArray(data) ? data : [];
        document.getElementById('totalCount').textContent = applicants.length.toLocaleString();
        showEmptyState();
      })
      .catch(function () {
        document.getElementById('totalCount').textContent = '0';
        resultsEl.innerHTML = '<div class="no-results">We could not load the applicant records. Please refresh the page or try again later.</div>';
        resultsCountEl.textContent = '0 matches';
      });

    function formatName(person) {
      const first = (person.first_name || '').trim();
      const middle = (person.middle_name || '').trim();
      const last = (person.last_name || '').trim();
      const middleInitial = middle ? middle.split(/\s+/).filter(Boolean).map(function (segment) {
        return segment.charAt(0).toUpperCase() + '.';
      }).join(' ') : '';

      return last.toUpperCase() + ', ' + first + (middleInitial ? ' ' + middleInitial : '');
    }

    function showEmptyState() {
      resultsEl.innerHTML = '<div class="empty-state">You may view the results here.</div>';
      resultsCountEl.textContent = '0 matches';
    }

    function renderResults(list) {
      if (!list.length) {
        resultsEl.innerHTML = '<div class="no-results">No match found. Please check your spelling or try a different keyword.</div>';
        resultsCountEl.textContent = '0 matches';
        return;
      }

      resultsEl.innerHTML = list
        .slice(0, 50)
        .map(function (person) {
          return '<div class="person-card">' +
            '<div>' +
              '<p class="person-name">' + formatName(person) + '</p>' +
            '</div>' +
            '<span class="badge">Qualified</span>' +
          '</div>';
        })
        .join('');

      resultsCountEl.textContent = list.length === 1 ? '1 match' : list.length + ' matches';
    }

    inputEl.addEventListener('input', function (event) {
      const query = event.target.value.trim();
      clearButton.hidden = !query;

      if (!query || query.length < 4) {
        showEmptyState();
        return;
      }

      const normalized = query.toLowerCase();
      const exactStudentMatch = applicants.filter(function (person) {
        return (person.student_num || '').trim().toLowerCase() === normalized;
      });

      const filtered = exactStudentMatch.length
        ? exactStudentMatch
        : applicants.filter(function (person) {
            const nameText = (
              (person.first_name || '') + ' ' +
              (person.middle_name || '') + ' ' +
              (person.last_name || '')
            ).toLowerCase();

            return nameText.includes(normalized);
          });

      renderResults(filtered);
    });

    clearButton.addEventListener('click', function () {
      inputEl.value = '';
      clearButton.hidden = true;
      showEmptyState();
      inputEl.focus();
    });
  </script>
</body>
</html>
